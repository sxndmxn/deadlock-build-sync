name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/arch-lint
            ~/.cargo/bin/rust-code-analysis-cli
            ~/.cargo/bin/fd
            ~/.cargo/bin/jaq
            ~/.cargo/bin/rg
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/ci.yml', 'scripts/check_repository.sh') }}

      - name: Install verification tools
        run: |
          cargo install rust-code-analysis-cli --version 0.0.25 --locked
          cargo install arch-lint-cli --version 0.6.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install fd-find --version 10.5.0 --locked
          cargo install jaq --version 3.1.1 --locked
          cargo install ripgrep --version 15.1.0 --locked

      - name: Install the SQL tool runner
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check the repository and release archive
        id: verify
        shell: bash
        run: bash scripts/check_repository.sh --release

      - name: Retain Rust code metrics
        if: ${{ !cancelled() && steps.verify.outputs.metrics_directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-code-analysis
          path: ${{ steps.verify.outputs.metrics_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain the verified Linux release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deadlock-build-sync-x86_64-unknown-linux-gnu
          path: |
            dist/deadlock-build-sync-*-x86_64-unknown-linux-gnu.tar.gz
            dist/deadlock-build-sync-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
