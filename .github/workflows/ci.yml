name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Lint DuckDB SQL
        run: uv run sqlfluff lint .

      - name: Type-check
        run: uv run ty check

      - name: Check declared dependencies
        run: uv run deptry .

      - name: Check module boundaries
        run: uv run tach check

      - name: Check cognitive complexity
        run: uv run complexipy

      - name: Test with branch coverage
        run: uv run coverage run -m pytest -W error

      - name: Write coverage report
        run: uv run coverage json

      - name: Enforce numeric quality limits
        run: uv run tools/quality_gate.py

      - name: Find dead code
        run: uv run vulture

      - name: Find repeated code
        run: uv run pylint --disable=all --enable=duplicate-code src scripts

      - name: Verify dependencies
        run: uv pip check

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        run: |
          uv venv /tmp/deadlock-build-sync-wheel
          uv pip install --python /tmp/deadlock-build-sync-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/deadlock-build-sync-wheel/bin/deadlock-build-sync --help
          /tmp/deadlock-build-sync-wheel/bin/build --help
