name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build the release CLI with analysis
        run: cargo build --package deadlock-build-sync --features analysis --release --locked

      - name: Verify the release version
        run: |
          version_output=$(target/release/deadlock-build-sync --version)
          test "$GITHUB_REF_NAME" = "v${version_output#deadlock-build-sync }"

      - name: Inspect and check the release archive outside the checkout
        run: sh scripts/package_release.sh "$PWD/target/release/deadlock-build-sync" x86_64-unknown-linux-gnu

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
