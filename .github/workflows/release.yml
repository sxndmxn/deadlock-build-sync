name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified Linux release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deadlock-build-sync-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify the archive checksum and release version
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$version" in
            ''|*[!a-zA-Z0-9.+-]*) exit 1 ;;
          esac
          package_name="deadlock-build-sync-$version-x86_64-unknown-linux-gnu"
          cd dist
          sha256sum --check "$package_name.tar.gz.sha256"
          temporary_directory=$(mktemp -d)
          trap 'rm -rf -- "$temporary_directory"' EXIT
          tar -C "$temporary_directory" -xzf "$package_name.tar.gz"
          version_output=$("$temporary_directory/$package_name/deadlock-build-sync" --version)
          test "$version_output" = "deadlock-build-sync $version"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
