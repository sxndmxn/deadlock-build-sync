[workspace]
members = [
    "crates/deadlock-data",
    "crates/deadlock-input",
    "crates/deadlock-guides",
    "crates/deadlock-steam",
    "crates/deadlock-analysis",
    "crates/deadlock-build-sync",
    "tools/deadlock-quality",
]
default-members = ["crates/deadlock-build-sync"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/sxndmxn/deadlock-build-sync"

[workspace.dependencies]
deadlock-data = { path = "crates/deadlock-data", version = "0.1.0" }
deadlock-input = { path = "crates/deadlock-input", version = "0.1.0" }
deadlock-guides = { path = "crates/deadlock-guides", version = "0.1.0" }
deadlock-steam = { path = "crates/deadlock-steam", version = "0.1.0" }
deadlock-analysis = { path = "crates/deadlock-analysis", version = "0.1.0" }
base64 = "0.23.1"
basin = { version = "1.11.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
htmlize = { version = "1.1.0", default-features = false, features = ["unescape_fast"] }
duckdb = { version = "1.10505.0", default-features = false, features = ["bundled", "json", "parquet"] }
leiden-rs = { version = "0.8.1", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
regex-lite = "0.1.9"
ruzstd = { version = "0.9.0", default-features = false, features = ["std", "hash"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
statrs = { version = "0.19.1", default-features = false, features = ["std"] }
tempfile = "3.27.0"
ureq = { version = "3.4.1", default-features = false, features = ["rustls", "gzip"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unused_must_use = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[profile.dev.package.libduckdb-sys]
debug = false
