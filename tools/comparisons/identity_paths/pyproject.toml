[project]
name = "deadlock-identity-path-experiment"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deadlock-build-sync",
    "duckdb==1.5.5",
    "igraph>=0.11,<2",
    "leidenalg>=0.10,<0.12",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "polars>=1.33,<1.34",
    "pytest>=8.3,<10",
    "pytz>=2025.2",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"

[tool.uv.sources]
deadlock-build-sync = { path = "../../..", editable = true }
