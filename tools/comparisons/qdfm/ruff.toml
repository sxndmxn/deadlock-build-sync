# Research CLI code follows the existing offline producer's allowances.
# Numeric complexity, file-size, formatting, and all other lint rules still apply.
extend = "../../../pyproject.toml"

[lint.per-file-ignores]
"*.py" = [
    "print", # Long-running offline jobs report their stage and measurements.
    "too-many-arguments", # State, networks, and sampling parameters remain explicit.
    "too-many-positional-arguments",
    "too-many-locals", # Preserve named quantities in numerical routines.
]
"extract.py" = [
    "hardcoded-sql-expression", # SQL literals are escaped; hero IDs are constants.
]
"test_*.py" = ["assert"]
