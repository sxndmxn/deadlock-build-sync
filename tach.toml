# The optional producer may use runtime code. Only the main CLI may call it.
# One source root avoids ambiguous module identities from overlapping roots.
source_roots = ["src"]
exclude = ["**/__pycache__/**"]
root_module = "forbid"
ignore_type_checking_imports = false
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "deadlock_build_sync"
depends_on = []

[[modules]]
path = "deadlock_build_sync.cli"
depends_on = ["deadlock_build_sync", "deadlock_build_sync.offline"]

[[modules]]
path = "deadlock_build_sync.offline"
depends_on = ["deadlock_build_sync"]
