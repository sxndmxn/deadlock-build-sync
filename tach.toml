# Boundaries follow current responsibilities; see docs/architecture.md.
# Keep the source root unambiguous. Packaged scripts are checked by Deptry.
source_roots = ["src"]
exclude = ["**/__pycache__/**"]
root_module = "forbid"
ignore_type_checking_imports = false
exact = true
forbid_circular_dependencies = true
layers_explicit_depends_on = true
layers = ["entrypoints", "workflows", "storage", "runtime", "inputs", "foundation"]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

