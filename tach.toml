# Only the producer command is public to runtime entrypoints.
[[interfaces]]
from = ['^deadlock_build_sync\.offline$']
expose = ['^refresh\.main$']

# Read-only consumers cannot gain installation or restore access through cache.py.
[[interfaces]]
from = ['^deadlock_build_sync\.cache$']
expose = [
  "^CACHE_RELATIVE_PATH$",
  "^DEADLOCK_APP_ID$",
  "^STEAM_ROOT_RELATIVE_PATHS$",
  "^BuildKey$",
  "^CacheError$",
  "^CacheLocation$",
  "^InstallResult$",
  "^deadlock_is_running$",
  "^discover_cache$",
  "^read_cache$",
  "^steam_root$",
  "^steam_roots$",
]

[[interfaces]]
from = ['^deadlock_build_sync\.cache$']
expose = ["^install_guides$"]
visibility = ["deadlock_build_sync.cli_support"]

[[interfaces]]
from = ['^deadlock_build_sync\.cache$']
expose = ["^restore_latest$"]
visibility = ["deadlock_build_sync.cli_export"]
