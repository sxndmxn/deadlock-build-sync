[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadlock-build-sync"
version = "0.1.0"
description = "Generate private Deadlock purchase-guide builds from deadlock-api.com analytics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "build-guide",
  "cli",
  "deadlock",
  "game-analytics",
  "linux",
  "steam",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "cattrs>=26.1,<27",
  "httpx>=0.28,<0.29",
  "keyvalues3>=0.7,<0.8",
]

[project.urls]
Changelog = "https://github.com/sxndmxn/deadlock-build-sync/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sxndmxn/deadlock-build-sync#readme"
Issues = "https://github.com/sxndmxn/deadlock-build-sync/issues"
Repository = "https://github.com/sxndmxn/deadlock-build-sync"

[project.optional-dependencies]
analysis = [
  "duckdb==1.5.5",
  "igraph>=1.0,<1.1",
  "leidenalg>=0.11,<0.12",
  "threadpoolctl>=3.6,<4",
  "numpy>=2.3,<2.4",
  "polars>=1.33,<1.34",
  "pyarrow>=23.0.1,<24",
  "pytz>=2025.2",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.16,<1.17",
]
test = [
  "pytest>=8.3",
]

[project.scripts]
deadlock-build-sync = "deadlock_build_sync.cli:main"
build = "deadlock_build_sync.cli:build_main"

[dependency-groups]
dev = [
  "complexipy>=5,<7",
  "coverage>=7.13,<8",
  "duckdb==1.5.5",
  "igraph>=1.0,<1.1",
  "leidenalg>=0.11,<0.12",
  "threadpoolctl>=3.6,<4",
  "mutmut>=3,<4",
  "numpy>=2.3,<2.4",
  "polars>=1.33,<1.34",
  "pyarrow>=23.0.1,<24",
  "pytest>=8.3",
  "pylint>=3,<5",
  "pytz>=2025.2",
  "radon>=6,<7",
  "ruff>=0.16.0",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.16,<1.17",
  "ty>=0.0.64",
  "vulture>=2,<3",
  "deptry>=0.25.1",
  "tach>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock_build_sync", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"

[tool.pytest.ini_options]
addopts = "-q -p no:tach"
pythonpath = ["."]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["deadlock_build_sync", "scripts"]
optional_dependencies_dev_groups = ["test"]
extend_exclude = ["^generated/", "^tools/", "^dist/", "^mutants/"]

[tool.deptry.per_rule_ignores]
# DuckDB/Polars load Arrow at their conversion boundary. Arrow uses pytz for timestamps.
DEP002 = ["pyarrow", "pytz"]

[tool.coverage.run]
branch = true
source = [
  "deadlock_build_sync",
  "scripts",
]

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true

[tool.complexipy]
check-script = false
max-complexity-allowed = 21
no-ignore = true
paths = [
  "scripts",
  "src",
  "tests",
  "tools",
]
quiet = false

[tool.mutmut]
also_copy = ["docs", "tools"]
only_mutate = [
  "src/deadlock_build_sync/cache.py",
  "src/deadlock_build_sync/cache_discovery.py",
  "src/deadlock_build_sync/cache_install.py",
  "src/deadlock_build_sync/cache_projection.py",
  "src/deadlock_build_sync/cache_storage.py",
  "src/deadlock_build_sync/cache_types.py",
  "src/deadlock_build_sync/kv3_binary.py",
  "src/deadlock_build_sync/protobuf.py",
]
pytest_add_cli_args = [
  "-W",
  "error",
  "-k",
  "not test_stage_trace_covers_presentation_and_protobuf_with_safe_facts and not test_trace_summary_renders_tree_and_per_function_time",
]
pytest_add_cli_args_test_selection = ["tests"]
source_paths = [
  "scripts",
  "src/deadlock_build_sync",
]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 6

[tool.vulture]
# Comparison environments and generated files are not repository source.
exclude = ["*/.venv/*", "*/generated/*", "*/offline/discovery_types.py"] # TypedDict keys are read as dictionary keys.
min_confidence = 60
ignore_names = [
  "forward", # PyTorch calls this comparison model protocol method.
  "seed_randomness", # Pytest calls this comparison autouse fixture.
  "ABILITY_DECISION",
  "ALCHEMIST",
  "ARCANIST",
  "ARCHON",
  "EVIDENCE_CONFLICT",
  "FOUR",
  "GAME",
  "INELIGIBLE",
  "ITEM_FLOW_PAIR",
  "MYSTIC",
  "RITUALIST",
  "STALE_MECHANICS",
  "TRAIN",
  "_LayoutCohort",
  "_LayoutRow",
  "backbone_fold_matches",
  "buyer_matches",
  "buy_nw_q25",
  "buy_nw_q75",
  "comparison_baseline",
  "competing_events",
  "expected_calibration_error",
  "final_owned_items",
  "first_item_id",
  "focal_appearances",
  "fold_comparative_estimates",
  "fold_eligible_player_matches",
  "median_buy_net_worth",
  "median_duration_s",
  "outcome_rate",
  "player_matches",
  "previous_item_id",
  "raw_rate",
  "score_column",
  "selection_valid_buy_net_worth_observations",
  "shrunk_rate",
  "test_adoption",
  "valid_buy_nw_share",
  "wilson_lower_bound",
]
paths = [
  "scripts",
  "src",
  "tests",
  "tools",
]

[tool.uv]
index-strategy = "first-index"
managed = true
package = true
prerelease = "if-necessary"
required-version = ">=0.12,<0.13"
resolution = "highest"

[tool.uv.pip]
strict = true

[tool.ruff]
fix = false
line-length = 88
preview = true
show-fixes = true
target-version = "py312"
unsafe-fixes = false

[tool.ruff.lint]
allowed-confusables = ["–"]
ignore = [
  "f-string-in-exception", # Error messages intentionally include runtime context.
  "incorrect-blank-line-before-class", # Conflicts with D211.
  "line-too-long", # The formatter owns line wrapping.
  "magic-value-comparison", # Protocol and game-domain constants are meaningful.
  "missing-copyright-notice", # The project has no copyright-header policy.
  "missing-trailing-comma", # Conflicts with the formatter.
  "multi-line-summary-second-line", # Conflicts with D212.
  "raise-vanilla-args", # Custom exceptions intentionally carry contextual messages.
  "raw-string-in-exception", # Custom exceptions intentionally carry contextual messages.
  "single-line-implicit-string-concatenation", # Conflicts with the formatter.
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
]
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 21

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
  "print",
  "raise-within-try",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
  "too-many-statements-in-try-clause",
]
"src/deadlock_build_sync/artifact_reconstruction.py" = [
  "too-many-arguments", # Keep compatibility inputs explicit at the reviewed artifact boundary.
  "too-many-positional-arguments",
]
"src/deadlock_build_sync/match_choices.py" = [
  "too-many-boolean-expressions", # Validate the closed branch contract field by field.
]
"src/deadlock_build_sync/recommendation.py" = [
  "too-many-return-statements", # Preserve the legacy policy replay adapter beside the canonical planner.
]
"src/deadlock_build_sync/api.py" = [
  "suspicious-url-open-usage", # The constructor restricts requests to HTTP(S).
  "too-many-arguments", # Snapshot identity is explicit at this I/O boundary.
]

# Numeric exceptions name only the modules and rules that still need them.
"src/deadlock_build_sync/build_evidence_item.py" = ["too-many-arguments"]
"src/deadlock_build_sync/build_evidence_references.py" = ["too-many-arguments"]
"src/deadlock_build_sync/build_evidence_sequence.py" = ["too-many-boolean-expressions"]

"src/deadlock_build_sync/build_evidence_values.py" = ["too-many-boolean-expressions"]
"src/deadlock_build_sync/cache*.py" = [
  "too-many-arguments",
  "too-many-branches", # The mutation boundary validates each durability/safety gate explicitly.
  "too-many-locals", # Pre/post identities remain named for auditability.
  "too-many-statements", # Install, validation, and recovery form one transaction.
  "too-many-statements-in-try-clause",
  "raise-within-try", # Validation failures are recovered by the surrounding transaction.
]
"src/deadlock_build_sync/cli*.py" = [
  "import-outside-top-level", # Optional analysis dependencies stay lazy.
  "print",
  "too-many-statements", # The flat CLI keeps every user command visible in one parser.
]
"src/deadlock_build_sync/evaluation.py" = [
  "too-many-branches", # Monitoring retains explicit rollback, refusal, and alert precedence.
]
"src/deadlock_build_sync/kv3_binary.py" = [
  "float-equality-comparison",
  "too-many-branches",
]
"src/deadlock_build_sync/narratives.py" = [
  "too-many-boolean-expressions",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
]
"src/deadlock_build_sync/offline/*.py" = [
  "docstring-missing-exception",
  "docstring-missing-returns",
  "hardcoded-sql-expression", # SQL is local and built only from pinned constants/validated integer IDs.
  "print", # The long-running producer emits CLI progress directly.
  "subprocess-without-shell-equals-true", # Git arguments are fixed and the executable path is resolved.
  "suspicious-subprocess-import", # Producer records Git identity with a resolved executable and shell disabled.
  "type-check-without-type-error", # Malformed artifact values are domain validation failures.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
]

"src/deadlock_build_sync/offline/doubly_robust_estimation.py" = ["too-many-locals"]
"src/deadlock_build_sync/offline/discovery_branches.py" = ["too-many-locals"]

"src/deadlock_build_sync/offline/discovery_mining.py" = ["too-many-arguments", "too-many-positional-arguments"]

"src/deadlock_build_sync/offline/discovery_patterns.py" = ["too-many-arguments", "too-many-positional-arguments"]

"src/deadlock_build_sync/policy*.py" = [
  "docstring-extraneous-exception", # Lazy codec delegates raise the documented PolicyError.
  "import-outside-top-level", # Lazy codec imports avoid a model/codec import cycle.
  "too-many-return-statements", # Typed guard dispatch has one terminal per operator.
  "too-many-statements-in-try-clause", # Mechanics errors are translated at one boundary.
]

"src/deadlock_build_sync/strategy_context.py" = [
  "too-many-arguments", # Closed evidence packet inputs remain explicit at export.
]
"src/deadlock_build_sync/tracing*.py" = [
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
]

"src/deadlock_build_sync/service_generation.py" = ["too-many-arguments", "too-many-locals"]
"src/deadlock_build_sync/service_policy.py" = ["too-many-locals"]
"tests/*.py" = [
  "assert",
  "float-equality-comparison",
  "implicit-namespace-package",
  "private-member-access", # Fault-injection tests exercise internal safety boundaries.
  "pytest-composite-assertion",
]
"tests/offline/*.py" = [
  "assert",
  "boolean-positional-value-in-call", # Compact fixtures mirror the frozen analytical dataclasses.
  "float-equality-comparison",
  "import-private-name", # Unit tests exercise pure producer helpers directly.
  "pytest-composite-assertion",
]
"tools/*.py" = [
  "subprocess-without-shell-equals-true", # Git arguments are fixed and shell use is disabled.
  "suspicious-subprocess-import", # The gate resolves Git and runs fixed read-only arguments.
]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
preview = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

[tool.ty.environment]
python-platform = "all"
python-version = "3.12"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = [
  "scripts",
  "src",
  "tests",
]

[tool.ty.terminal]
error-on-warning = true
