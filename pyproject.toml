[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadlock-build-sync"
version = "0.1.0"
description = "Generate private Deadlock purchase-guide builds from deadlock-api.com analytics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "build-guide",
  "cli",
  "codex",
  "deadlock",
  "game-analytics",
  "linux",
  "steam",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "cattrs>=26.1,<27",
  "httpx>=0.28,<0.29",
  "keyvalues3>=0.7,<0.8",
]

[project.urls]
Changelog = "https://github.com/sxndmxn/deadlock-build-sync/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sxndmxn/deadlock-build-sync#readme"
Issues = "https://github.com/sxndmxn/deadlock-build-sync/issues"
Repository = "https://github.com/sxndmxn/deadlock-build-sync"

[project.optional-dependencies]
analysis = [
  "duckdb==1.5.5",
  "joblib>=1.5,<1.6",
  "matplotlib>=3.10,<3.11",
  "numpy>=2.3,<2.4",
  "polars>=1.33,<1.34",
  "pyarrow>=21,<22",
  "pytz>=2025.2",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.16,<1.17",
]
test = [
  "pytest>=8.3",
]

[project.scripts]
deadlock-build-sync = "deadlock_build_sync.cli:main"

[dependency-groups]
dev = [
  "duckdb==1.5.5",
  "deepeval==4.1.1",
  "joblib>=1.5,<1.6",
  "matplotlib>=3.10,<3.11",
  "numpy>=2.3,<2.4",
  "polars>=1.33,<1.34",
  "pyarrow>=21,<22",
  "pytest>=8.3",
  "pytz>=2025.2",
  "ruff>=0.16.0",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.16,<1.17",
  "ty>=0.0.64",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock_build_sync", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"

[tool.pytest.ini_options]
addopts = "-q"
norecursedirs = ["tests/evals"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
index-strategy = "first-index"
managed = true
package = true
prerelease = "if-necessary"
required-version = ">=0.12,<0.13"
resolution = "highest"

[tool.uv.pip]
strict = true

[tool.ruff]
fix = false
line-length = 88
preview = true
show-fixes = true
target-version = "py312"
unsafe-fixes = false

[tool.ruff.lint]
allowed-confusables = ["–"]
ignore = [
  "any-type", # Dynamic API and KV3 payloads require explicit Any boundaries.
  "f-string-in-exception", # Error messages intentionally include runtime context.
  "incorrect-blank-line-before-class", # Conflicts with D211.
  "line-too-long", # The formatter owns line wrapping.
  "magic-value-comparison", # Protocol and game-domain constants are meaningful.
  "missing-copyright-notice", # The project has no copyright-header policy.
  "missing-trailing-comma", # Conflicts with the formatter.
  "multi-line-summary-second-line", # Conflicts with D212.
  "raise-vanilla-args", # Custom exceptions intentionally carry contextual messages.
  "raw-string-in-exception", # Custom exceptions intentionally carry contextual messages.
  "single-line-implicit-string-concatenation", # Conflicts with the formatter.
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"evals/metrics.py" = [
  "bad-dunder-method-name", # DeepEval uses __name__ as the custom metric label API.
  "complex-structure",
  "too-many-locals",
  "too-many-statements",
]
"scripts/*.py" = [
  "complex-structure",
  "print",
  "raise-within-try",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
  "too-many-statements-in-try-clause",
  "try-consider-else",
]
"src/deadlock_build_sync/api.py" = [
  "suspicious-url-open-usage", # The constructor restricts requests to HTTP(S).
  "too-many-arguments", # Snapshot identity is explicit at this I/O boundary.
]
"src/deadlock_build_sync/artifacts.py" = [
  "complex-structure", # Sidecar admission reports every identity and coverage defect.
]
"src/deadlock_build_sync/build_evidence.py" = [
  "complex-structure", # Artifact admission checks every identity, count, and layout invariant.
  "too-many-arguments", # Compatibility inputs stay explicit at the artifact boundary.
  "too-many-boolean-expressions", # Malformed evidence is rejected field by field.
  "too-many-branches", # Hero admission reports each malformed count and layout invariant precisely.
  "too-many-locals", # Admission retains named identity fields for precise incompatibility errors.
]
"src/deadlock_build_sync/cache.py" = [
  "complex-structure",
  "too-many-arguments",
  "too-many-branches", # The mutation boundary validates each durability/safety gate explicitly.
  "too-many-locals", # Pre/post identities remain named for auditability.
  "too-many-statements", # Install, validation, and recovery form one transaction.
  "too-many-statements-in-try-clause",
  "raise-within-try", # Validation failures are recovered by the surrounding transaction.
]
"src/deadlock_build_sync/cli.py" = [
  "import-outside-top-level", # Optional analysis dependencies stay lazy.
  "print",
  "too-many-statements", # The flat CLI keeps every user command visible in one parser.
]
"src/deadlock_build_sync/evaluation.py" = [
  "complex-structure", # Evaluation and rollback gates report each independent failure mode.
  "too-many-branches", # Monitoring retains explicit rollback, refusal, and alert precedence.
]
"src/deadlock_build_sync/kv3_binary.py" = [
  "complex-structure",
  "float-equality-comparison",
  "too-many-branches",
]
"src/deadlock_build_sync/mechanics.py" = [
  "complex-structure", # Mechanics validation enumerates currency and legal-state gates.
]
"src/deadlock_build_sync/narratives.py" = [
  "complex-structure", # Artifact admission reports each identity and coverage failure explicitly.
  "too-many-boolean-expressions",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
]
"src/deadlock_build_sync/offline/*.py" = [
  "complex-structure", # Analytical stages keep their computations together for reproducibility.
  "docstring-missing-exception",
  "docstring-missing-returns",
  "hardcoded-sql-expression", # SQL is local and built only from pinned constants/validated integer IDs.
  "manual-list-comprehension",
  "print", # The long-running producer emits CLI progress directly.
  "subprocess-without-shell-equals-true", # Git arguments are fixed and the executable path is resolved.
  "suspicious-subprocess-import", # Producer records Git identity with a resolved executable and shell disabled.
  "too-many-arguments",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-statements",
  "too-many-statements-in-try-clause",
  "type-check-without-type-error", # Malformed artifact values are domain validation failures.
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
]
"src/deadlock_build_sync/policy.py" = [
  "complex-structure", # Graph, guard, and legal-state validation are exhaustive by design.
  "docstring-extraneous-exception", # Lazy codec delegates raise the documented PolicyError.
  "import-outside-top-level", # Lazy codec imports avoid a model/codec import cycle.
  "too-many-return-statements", # Typed guard dispatch has one terminal per operator.
  "too-many-statements-in-try-clause", # Mechanics errors are translated at one boundary.
]
"src/deadlock_build_sync/protobuf.py" = ["too-many-arguments"]
"src/deadlock_build_sync/purchase_guide.py" = [
  "complex-structure",
  "too-many-locals",
]
"src/deadlock_build_sync/renderer.py" = [
  "complex-structure", # Projection validates layout and Queue semantics together.
]
"src/deadlock_build_sync/strategy_context.py" = [
  "complex-structure", # Artifact admission checks every completeness/fingerprint gate.
  "too-many-arguments", # Closed evidence packet inputs remain explicit at export.
  "too-many-boolean-expressions", # Tag identity is admitted as one closed contract.
  "too-many-branches", # Validation reports exact malformed artifact conditions.
]
"src/deadlock_build_sync/tracing.py" = [
  "complex-structure", # The streaming summarizer validates and routes every event shape.
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
]
"src/deadlock_build_sync/service.py" = [
  "complex-structure", # Cohort collection and policy construction enforce staged abstentions.
  "too-many-arguments", # Structured skip reporting retains hero identity and reason.
  "too-many-branches", # Policy construction keeps each mechanics-backed conditional gate explicit.
  "too-many-locals", # Evidence identities stay named across collection and projection.
  "too-many-statements", # One orchestration pass freezes and materializes a coherent snapshot.
]
"tests/*.py" = [
  "assert",
  "float-equality-comparison",
  "implicit-namespace-package",
  "private-member-access", # Fault-injection tests exercise internal safety boundaries.
  "pytest-composite-assertion",
]
"tests/offline/*.py" = [
  "assert",
  "boolean-positional-value-in-call", # Compact fixtures mirror the frozen analytical dataclasses.
  "float-equality-comparison",
  "import-private-name", # Unit tests exercise pure producer helpers directly.
  "pytest-composite-assertion",
]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
preview = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true

[tool.ty.environment]
python-platform = "all"
python-version = "3.12"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = [
  "evals",
  "scripts",
  "src",
  "tests",
]

[tool.ty.terminal]
error-on-warning = true
